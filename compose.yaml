services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: bridgephone
      POSTGRES_PASSWORD: bridgephone
      POSTGRES_DB: bridgephone
    ports:
      - "5432:5432"
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "bridgephone"]
      interval: 2s
      retries: 15

  app:
    build: .
    environment:
      DATABASE_URL: postgres://bridgephone:bridgephone@db:5432/bridgephone
      APP_URL: http://localhost:3000
      SITE_ADMINS: ${SITE_ADMINS:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      DEV_LOGIN: ${DEV_LOGIN:-false}
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db:
